name: iPhone simulator smoke test
on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Assets.xcassets/**'
      - 'MediaMind.xcodeproj/**'
      - 'Tests/App/**'
      - 'tools/generate_xcodeproj.py'
      - 'tools/smoke_simulator_macos.sh'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: simulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  launch:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build, test media import and capture iPhone simulator
        run: bash tools/smoke_simulator_macos.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simulator-smoke-${{ github.sha }}
          path: build/smoke/
          if-no-files-found: error
          retention-days: 14
