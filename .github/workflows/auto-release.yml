name: Auto release (Conventional Commits + SemVer)
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: semver-release-master
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      release_sha: ${{ steps.branch.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Test release tooling
        run: |
          python3 tools/test_release.py
          python3 tools/test_ipa.py
      - name: Decide SemVer from git history
        id: plan
        run: python3 tools/release.py plan --output "$GITHUB_OUTPUT"
      - name: Create versioned release branch
        if: steps.plan.outputs.should_release == 'true'
        id: branch
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "release/v$VERSION"
          python3 tools/release.py prepare --version "$VERSION"
          python3 tools/generate_xcodeproj.py
          project=$(python3 -c 'import json;print(json.load(open("Config/project.json"))["name"])')
          git add Config/version.json CHANGELOG.md "$project.xcodeproj/project.pbxproj"
          git commit -m "chore(release): v$VERSION"
          git push origin "release/v$VERSION"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    if: needs.prepare.outputs.should_release == 'true'
    needs: prepare
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v${{ needs.prepare.outputs.version }}
      - name: Run Swift core tests
        run: swift test -j 2
      - name: Build and verify unsigned iPhone IPA
        run: bash tools/build_ipa_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: |
            build/dist/*-unsigned.ipa
            build/dist/*.sha256
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: dist
      - name: Publish GitHub Release containing IPA
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$(find dist -maxdepth 1 -name "*-unsigned.ipa" -print -quit)"
          gh release create "v$VERSION" dist/*-unsigned.ipa dist/*.sha256 --target "$RELEASE_SHA" --title "v$VERSION" --generate-notes
      - name: Merge release branch back into master by fast-forward
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master "release/v$VERSION"
          git switch -C master origin/master
          if git merge --ff-only "origin/release/v$VERSION" && git push origin HEAD:master; then
            git push origin --delete "release/v$VERSION"
          else
            echo 'Protected master: leave release branch intact and open PR for approval.'
            gh pr create --base master --head "release/v$VERSION" --title "chore(release): merge v$VERSION" --body 'Build/release passed. Merge this release branch according to branch protection rules.' || true
            exit 1
          fi
